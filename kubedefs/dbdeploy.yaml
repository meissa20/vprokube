apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      containers:
        - name: vprodb
          image: meissa20/vprodb:latest
          ports:
            - containerPort: 3306
              name: vprodb-port
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vproapp-secret
                  key: db-pass
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: vprodb-storage
              mountPath: /var/lib/mysql
      initContainers:
        - name: busybox
          image: busybox
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              if [ -d /var/lib/mysql/lost+found ]; then
                rm -rf /var/lib/mysql/lost+found
              fi
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: vprodb-storage
      volumes:
        - name: vprodb-storage
          persistentVolumeClaim:
            claimName: db-pvc